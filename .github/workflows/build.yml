name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          B=app/src/main
          mkdir -p $B/assets $B/java/com/neon/launcher $B/res/xml $B/res/mipmap-xxxhdpi
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml $B/
          mv paths.xml $B/res/xml/
          mv MainActivity.kt $B/java/com/neon/launcher/
          mv NeonGlassUI.mcpack $B/assets/
          mv ic_launcher.png $B/res/mipmap-xxxhdpi/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
